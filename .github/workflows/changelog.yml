name: "Update Changelog"

on:
  release:
    types: [released]
  # A release made with GITHUB_TOKEN (pricing-release.yml) triggers no other
  # workflow, so that workflow calls this one itself.
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      notes:
        type: string
        required: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Update Changelog
        uses: stefanzweifel/changelog-updater-action@v1
        with:
          latest-version: ${{ inputs.version || github.event.release.name }}
          release-notes: ${{ inputs.notes || github.event.release.body }}

      - name: Commit updated CHANGELOG
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          commit_message: Update CHANGELOG
          file_pattern: CHANGELOG.md
          commit_user_name: Ahmad Mayahi
          commit_user_email: ahmad.mayahi@gmail.com
          commit_author: Ahmad Mayahi <ahmad.mayahi@gmail.com>
